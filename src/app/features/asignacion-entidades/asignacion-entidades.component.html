<div class="card">
	<h2 class="p-mb-4">Asignación de Entidades Responsables</h2>

	<p-table [value]="ordenes" [paginator]="false" [rows]="10" responsiveLayout="scroll">
		<ng-template pTemplate="header">
			<tr>
				<th>ID Orden</th>
				<th>Tipo de orden</th>
				<th>Entidades asignadas</th>
				<th style="width: 10rem">Acciones</th>
			</tr>
		</ng-template>

			<ng-template pTemplate="body" let-orden>
				<tr>
					<td>{{ orden.id }}</td>
					<td>{{ orden.tipo }}</td>
					<td>
						<ng-container *ngIf="editingRowId !== orden.id; else editRow">
							<ng-container *ngFor="let e of orden.entidades">
								<p-chip label="{{ e }}" styleClass="p-mr-2 p-mb-2"></p-chip>
							</ng-container>
						</ng-container>
						<ng-template #editRow>
													<div class="chips-list p-mb-3">
														<p-chip *ngFor="let e of selectedEntidades" [label]="e.nombre" removable="true" (remove)="removeEntidad(e)" styleClass="p-mr-2 p-mb-2"></p-chip>
													</div>
													<p-autoComplete class="ac-add-entidades" [(ngModel)]="acQuery" [suggestions]="filteredEntities" (completeMethod)="searchEntities($event)" field="nombre" [multiple]="false" (onSelect)="onEntitySelect($event)" [forceSelection]="true" placeholder="Añadir/quitar entidades" appendTo="body" [panelStyle]="{ 'z-index': 1100, 'max-height': '300px', 'overflow': 'auto' }"></p-autoComplete>
						</ng-template>
					</td>
					<td>
						<ng-container *ngIf="editingRowId !== orden.id; else editActions">
							<button pButton type="button" label="Modificar" class="p-button-rounded p-button-primary" (click)="startInlineEdit(orden)"></button>
						</ng-container>
						<ng-template #editActions>
							<div class="edit-buttons">
								<button pButton type="button" label="Cerrar edición" class="p-button-success" (click)="saveInlineEdit()"></button>
								<button pButton type="button" label="Cancelar" class="p-button-secondary" (click)="cancelInlineEdit()"></button>
							</div>
						</ng-template>
					</td>
				</tr>
			</ng-template>
	</p-table>

			<div class="footer-bar p-d-flex p-jc-end p-mt-4">
				<button pButton type="button" label="Guardar" class="p-button-success p-mr-2" (click)="onGuardar()"></button>
				<button pButton type="button" label="Cancelar" class="p-button-secondary" (click)="onCancelar()"></button>
			</div>

		</div>
